name: inf_flutter
description: "INF for Android — 微博第三方客户端（Flutter 重写版）"
publish_to: "none"
version: 1.6.8+68

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

  # HarmonyOS NEXT implementations of the plugins above, from the OpenHarmony-Flutter ports.
  # Other platforms ignore them; build for ohos with the flutter_flutter fork (see README).
  #
  # Vendored into third_party instead of pubspec git dependencies: they came from gitcode.com,
  # which answers GitHub Actions' addresses with HTTP 418 ("I'm a teapot"), so `flutter pub get`
  # failed there in two seconds while working from a normal network. The copies are the packages
  # at the refs this file used to name; `example/` is left out.
  path_provider_ohos:
    path: third_party/path_provider_ohos
  shared_preferences_ohos:
    path: third_party/shared_preferences_ohos
  image_picker_ohos:
    path: third_party/image_picker_ohos
  video_player_ohos:
    path: third_party/video_player_ohos
  webview_flutter_ohos:
    path: third_party/webview_flutter_ohos
  liquid_glass_widgets: ^1.17.0

dependency_overrides:
  # sqflite (under flutter_cache_manager) with its ohos implementation; see the note above.
  sqflite:
    path: third_party/sqflite
  # webview_flutter_ohos pins the fork's copy of this; the pub.dev one is what webview_flutter uses.
  webview_flutter_platform_interface: ^2.14.0
  # cached_network_image builds on these; see third_party/material_ui.
  material_ui:
    path: third_party/material_ui
  cupertino_ui:
    path: third_party/cupertino_ui
  # The pub.dev package with the side rail's pressed lens as a capsule rather than a circle; see
  # _lensSize in lib/src/widgets/surfaces/tab_bar_vertical_layout.dart.
  liquid_glass_widgets:
    path: third_party/liquid_glass_widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
