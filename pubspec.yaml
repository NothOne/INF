name: inf_flutter
description: "INF for Android — 微博第三方客户端（Flutter 重写版）"
publish_to: "none"
version: 1.3.2+52

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.4
  dio: ^5.11.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

  # HarmonyOS NEXT implementations of the plugins above, from the OpenHarmony-Flutter ports.
  # Other platforms ignore them; build for ohos with the flutter_flutter fork (see README).
  path_provider_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: bddb2c981fcf826eaf19ed97f55113708aa55727
      path: packages/path_provider/path_provider_ohos
  shared_preferences_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: bddb2c981fcf826eaf19ed97f55113708aa55727
      path: packages/shared_preferences/shared_preferences_ohos
  image_picker_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: bddb2c981fcf826eaf19ed97f55113708aa55727
      path: packages/image_picker/image_picker_ohos
  video_player_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: bddb2c981fcf826eaf19ed97f55113708aa55727
      path: packages/video_player/video_player_ohos
  webview_flutter_ohos:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      ref: bddb2c981fcf826eaf19ed97f55113708aa55727
      path: packages/webview_flutter/webview_flutter_ohos

dependency_overrides:
  # sqflite (under flutter_cache_manager) with its ohos implementation.
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      ref: 9627805b994b89d8abc273a450bfb176142c5860
      path: sqflite
  # webview_flutter_ohos pins the fork's copy of this; the pub.dev one is what webview_flutter uses.
  webview_flutter_platform_interface: ^2.14.0
  # cached_network_image builds on these; see third_party/material_ui.
  material_ui:
    path: third_party/material_ui
  cupertino_ui:
    path: third_party/cupertino_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag