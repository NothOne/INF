name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Pinned: ubuntu-latest moved to Ubuntu 26, where android-actions/setup-android fails.
    runs-on: ubuntu-24.04
    # The version pinned below is the one pubspec.lock and .metadata were built with.
    env:
      FLUTTER_VERSION: 3.47.7
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Uses the image's SDK when it has one, otherwise fetches the command-line tools.
      # flutter.ndkVersion is 28.2.13676358; the runner image only ships 27.3/29/30.
      - name: Android SDK, NDK and CMake
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdk="$HOME/android-sdk"
            mkdir -p "$sdk/cmdline-tools"
            curl -sSfL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" "platform-tools" "ndk;$NDK_VERSION" "cmake;3.22.1"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing keystore
        # Same keystore as the local builds, so CI APKs upgrade in place over installed ones.
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/debug.keystore

      - run: flutter pub get

      # The project carries 50-odd info-level lints; only errors and warnings should fail the build.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: inf-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
