name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [dev, main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # The version pinned below is the one pubspec.lock and .metadata were built with.
    env:
      FLUTTER_VERSION: 3.47.7
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # flutter.ndkVersion is 28.2.13676358; the runner image only ships 27.3/29/30.
      - name: Install NDK and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing keystore
        # Same keystore as the local builds, so CI APKs upgrade in place over installed ones.
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/debug.keystore

      - run: flutter pub get

      # The project carries 50-odd info-level lints; only errors and warnings should fail the build.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: inf-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
