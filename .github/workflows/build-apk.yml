name: build-apk

on:
  workflow_dispatch:
  # release.yml calls this on a version tag; the caller passes the keystore secret.
  workflow_call:
    secrets:
      DEBUG_KEYSTORE_BASE64:
        required: true
  push:
    branches: [dev, main]

jobs:
  apk:
    # Job-level, not workflow-level: this file is also called from release.yml.
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true
    # Pinned: ubuntu-latest moved to Ubuntu 26, where android-actions/setup-android fails.
    runs-on: ubuntu-24.04
    # The version pinned below is the one pubspec.lock and .metadata were built with.
    env:
      FLUTTER_VERSION: 3.47.7
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Cache ~/.gradle/caches and wrapper so builds don't cold-fetch Maven Central every run.
      - uses: gradle/actions/setup-gradle@v4

      # GitHub Actions runners occasionally hit HTTP 429 from repo.maven.apache.org;
      # try Google's Maven Central mirror first and keep upstream repos as fallback.
      - name: Configure Gradle Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          import org.gradle.api.initialization.resolve.RepositoriesMode

          def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2'
          def prependMirror = { repos ->
            def mirror = repos.maven {
              name = 'GoogleMavenCentralMirror'
              url = uri(mirrorUrl)
            }
            repos.remove(mirror)
            repos.addFirst(mirror)
          }

          def allowProjectRepos = new IdentityHashMap()

          beforeSettings { settings ->
            prependMirror(settings.pluginManagement.repositories)
          }

          settingsEvaluated { settings ->
            if (settings.pluginManagement.repositories.size() == 1) {
              settings.pluginManagement.repositories.gradlePluginPortal()
            }
            def mode = settings.dependencyResolutionManagement.repositoriesMode.get()
            def allow = (mode == RepositoriesMode.PREFER_PROJECT)
            allowProjectRepos[settings.gradle] = allow
            if (!allow) {
              prependMirror(settings.dependencyResolutionManagement.repositories)
            }
          }

          allprojects {
            buildscript {
              prependMirror(repositories)
            }
            if (allowProjectRepos[project.gradle] != false) {
              prependMirror(repositories)
            }
          }
          EOF

      # Uses the image's SDK when it has one, otherwise fetches the command-line tools.
      # flutter.ndkVersion is 28.2.13676358; the runner image only ships 27.3/29/30.
      - name: Android SDK, NDK and CMake
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdk="$HOME/android-sdk"
            mkdir -p "$sdk/cmdline-tools"
            curl -sSfL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" "platform-tools" "ndk;$NDK_VERSION" "cmake;3.22.1"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing keystore
        # Same keystore as the local builds, so CI APKs upgrade in place over installed ones.
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/debug.keystore

      - run: flutter pub get

      # The project carries 50-odd info-level lints; only errors and warnings should fail the build.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      # CODE_MAP.md states a file count and lists every file; this fails when a refactor left it
      # describing a tree that no longer exists.
      - run: python3 tools/doc_facts.py --check

      - name: Build release APK
        run: |
          for attempt in 1 2; do
            if flutter build apk --release --target-platform android-arm64; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "APK build failed on attempt $attempt; retrying in 25s..."
            sleep 25
          done

      - name: Name the APK
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/INF-$version.apk"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: inf-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
