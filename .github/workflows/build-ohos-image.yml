name: build-ohos-image

# Manual: rebuilds the HarmonyOS build image when the command-line-tools
# version changes. Not on push — the image is only tied to the SDK, not to
# the app's source.
on:
  workflow_dispatch:
    inputs:
      clt_url:
        description: "Direct URL of the command-line-tools tarball (see docker/ohos/Dockerfile)"
        required: true
        type: string
      tag:
        description: "Image tag, usually the command-line-tools version (e.g. 26.0.0.851)"
        required: true
        type: string

concurrency:
  group: build-ohos-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Download command-line-tools
        env:
          CLT_URL: ${{ inputs.clt_url }}
          CLT_TOKEN: ${{ secrets.HARMONYOS_CLT_TOKEN }}
        run: |
          curl_args=(-fL --retry 3)
          if [ -n "$CLT_TOKEN" ]; then
            curl_args+=(-H "Authorization: Bearer $CLT_TOKEN")
          fi
          curl "${curl_args[@]}" "$CLT_URL" -o /tmp/clt.archive
          # ADD in the Dockerfile expects this exact name; the archive is an
          # .tar.xz built by the tar command documented there.
          mv /tmp/clt.archive docker/ohos/clt.tar.xz
          ls -lh docker/ohos/clt.tar.xz
          # The Dockerfile unpacks it with ADD, which only handles tar archives.
          tar -tf docker/ohos/clt.tar.xz | head -3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/ohos
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ohos-clt:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}/ohos-clt:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HarmonyOS NEXT build environment for INF

      - name: Report the image size
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}/ohos-clt:${{ inputs.tag }}
